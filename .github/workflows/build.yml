name: Build
on:
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: always
  RUST_NIGHTLY_VERSION: nightly
jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.update_meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Override rust-toolchain for CI
        run: |
          (Get-Content rust-toolchain.toml) -replace 'channel = "nightly"', 'channel = "${{ env.RUST_NIGHTLY_VERSION }}"' | Set-Content rust-toolchain.toml
      - run: |
          rustup toolchain install ${{ env.RUST_NIGHTLY_VERSION }} --profile minimal
          rustup component add rust-src --toolchain ${{ env.RUST_NIGHTLY_VERSION }}
          rustup default ${{ env.RUST_NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install NPM Dependencies
        run: pnpm i
      - name: Update Meta
        id: update_meta
        run: |
          $tag = git describe --tags --abbrev=0 2>$null
          if (-not $tag) { $tag = "0.0.0" }
          $TAG = $tag -replace '^v', ''
          $PKGVER = "r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          $cstTimeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time")
          $utcNow = [System.DateTime]::UtcNow
          $cstTime = [System.TimeZoneInfo]::ConvertTimeFromUtc($utcNow, $cstTimeZone)
          $BUILDMETA = $cstTime.ToString("yyMMddHHmm")
          (Get-Content ./Cargo.toml -Raw) -replace '(?m)^(version = "\d+\.\d+\.\d+)', "version = `"$TAG-$PKGVER+$BUILDMETA" | Set-Content ./Cargo.toml -Encoding utf8
          echo "version=$TAG-$PKGVER+$BUILDMETA" >> $env:GITHUB_OUTPUT
      - name: Build
        run: pnpm build
      - name: Copy Binary
        run: copy target\x86_64-win7-windows-msvc\release\kachina-builder-bundle.exe kachina-builder.exe
      - name: Artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          path: |
            target/x86_64-win7-windows-msvc/release/*.exe
            target/x86_64-win7-windows-msvc/release/*.pdb
  unit-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Override rust-toolchain for CI
        run: |
          (Get-Content rust-toolchain.toml) -replace 'channel = "nightly"', 'channel = "${{ env.RUST_NIGHTLY_VERSION }}"' | Set-Content rust-toolchain.toml
      - run: |
          rustup toolchain install ${{ env.RUST_NIGHTLY_VERSION }} --profile minimal
          rustup component add rust-src --toolchain ${{ env.RUST_NIGHTLY_VERSION }}
          rustup default ${{ env.RUST_NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Rust unit tests
        run: cargo test

  release:
    needs: [build, test, unit-test]
    runs-on: windows-2022
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install NPM Dependencies
        run: pnpm i
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Copy Binary
        run: Copy-Item "artifacts/artifact/kachina-builder.exe" "kachina-builder.exe" -Force
      - name: Sentry upload
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: yuehaiteam
          SENTRY_PROJECT: kachina-installer
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:SENTRY_LOG_LEVEL = "info"
          echo "Creating Sentry release for version ${{ needs.build.outputs.version }}"
          pnpm exec sentry-cli releases new "${{ needs.build.outputs.version }}"
          echo "Setting release metadata for version ${{ needs.build.outputs.version }}"
          pnpm exec sentry-cli releases set-commits --auto "${{ needs.build.outputs.version }}"
          echo "Uploading debug files for version ${{ needs.build.outputs.version }}"
          pnpm exec sentry-cli debug-files upload ./artifacts/artifact/kachina_installer.pdb
          echo "Finalizing release for version ${{ needs.build.outputs.version }}"
          pnpm exec sentry-cli releases finalize "${{ needs.build.outputs.version }}"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: kachina-builder.exe
          make_latest: true
          body: "${{ needs.build.outputs.version }}"

  test:
    needs: build
    runs-on: windows-2022
    strategy:
      matrix:
        test: [offline-install, online-install, offline-update, online-update, dfs2, updater-survival, already-latest, uninstall, userdata-ignore, occupied-process, builder-extract-replace, plugin-stub]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install NPM Dependencies
        run: pnpm i
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Setup test environment
        run: |
          # 复制构建的二进制文件到正确位置
          New-Item -ItemType Directory -Force -Path "target/release"
          New-Item -ItemType Directory -Force -Path "target/x86_64-win7-windows-msvc/release"
          Copy-Item "artifacts/artifact/*.exe" "target/x86_64-win7-windows-msvc/release/" -Force
          Copy-Item "artifacts/artifact/*.pdb" "target/x86_64-win7-windows-msvc/release/" -Force
          Copy-Item "artifacts/artifact/*.exe" "target/release/" -Force
          Copy-Item "artifacts/artifact/*.pdb" "target/release/" -Force
          # 产物名保持 kachina-builder.exe（内容已是 bundle），为测试补 bundle 别名
          Copy-Item "artifacts/artifact/kachina-builder.exe" "target/x86_64-win7-windows-msvc/release/kachina-builder-bundle.exe" -Force
          Copy-Item "artifacts/artifact/kachina-builder.exe" "target/release/kachina-builder-bundle.exe" -Force
      - name: Prepare test fixtures
        run: npm run test:prepare
      - name: Run ${{ matrix.test }} test
        run: npm run test:${{ matrix.test }}
        timeout-minutes: 10
